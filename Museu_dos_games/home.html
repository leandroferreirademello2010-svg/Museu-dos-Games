<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="./front.css">
<title>Museu Interativo dos Games</title>
</head>
<body>
<section id="home-screen" class="screen">
  <input type="checkbox" id="menu-toggle" class="menu-state" aria-label="Abrir ou fechar a barra lateral">
  <label for="menu-toggle" class="sidebar-backdrop" aria-hidden="true"></label>
  <aside class="sidebar" id="sidebar">
    <label for="menu-toggle" class="menu-close" aria-label="Fechar barra lateral"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l14 14M19 5L5 19"/></svg></label>
    <div class="brandmark">
      <div class="glyph">M</div>
      <div class="word">Museu Interativo <b>dos Games</b></div>
    </div>
    <nav class="nav-group">
      <a href="/home" class="nav-item active">
        <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h18M3 6h18M3 18h18"/></svg></span>
        Linha do tempo
      </a>
      <a href="/pesquisar" class="nav-item">
        <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
        Pesquisar
      </a>
      <a href="/perfil" class="nav-item">
        <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span>
        Perfil
      </a>
    </nav>
    <a href="/criar" class="nav-create">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Criar linha do tempo
    </a>
  </aside>
  <div class="main">
    <div class="topbar">
      <label for="menu-toggle" class="menu-btn" aria-label="Abrir barra lateral" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </label>
      <a href="/perfil" class="profile" title="Ver perfil">
        <div class="username">...</div>
        <div class="thumb"></div>
      </a>
    </div>
    <div class="content">
      <div class="page-head">
        <div class="kicker" id="tl-kicker">Acervo principal</div>
        <h1 id="tl-title">A linha do tempo dos games</h1>
        <p id="tl-desc"></p>
        <p class="hint">Passe o mouse sobre um marcador para ver tipo, ano e história do jogo.</p>
      </div>
      <div class="timeline-wrap">
        <div class="timeline-track" id="timeline-track" style="--plot-h:178px"></div>
      </div>
      <div class="rating-box">
        <div class="rating-info">
          <b id="rating-media" class="display"></b>
          <span id="rating-total"></span>
        </div>
        <div class="rating-vote">
          <span id="rating-label">Sua avaliação</span>
          <div class="stars" id="stars"></div>
        </div>
      </div>
    </div>
  </div>
</section>
<script type="module" src="./home.ts"></script>
</body>
</html>
