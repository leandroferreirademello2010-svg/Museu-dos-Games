<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="./front.css">
<title>Criar linha do tempo · Museu Interativo dos Games</title>
</head>
<body>
<section class="screen">
  <div class="criar-wrap">
    <a href="/home" class="btn-voltar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
      Voltar para a linha do tempo
    </a>
    <div class="page-head" style="margin-top:26px;margin-bottom:0">
      <div class="kicker">Novo percurso</div>
      <h1>Criar linha do tempo</h1>
      <p>Monte sua própria sequência de jogos, publique e deixe a comunidade avaliar.</p>
    </div>
    <form class="criar-form" id="criar-form">
      <div class="field">
        <label for="tl-titulo">Título</label>
        <input type="text" id="tl-titulo" maxlength="120" placeholder="Ex.: Meus RPGs favoritos dos anos 90" required>
      </div>
      <div class="field">
        <label for="tl-desc">Descrição</label>
        <textarea id="tl-desc" maxlength="1000" placeholder="Conte o que une os jogos desta linha do tempo"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="tl-inicio">Ano inicial</label>
          <input type="number" id="tl-inicio" min="1980" max="2026" placeholder="1980" required>
        </div>
        <div class="field">
          <label for="tl-fim">Ano final</label>
          <input type="number" id="tl-fim" min="1980" max="2026" placeholder="2026" required>
        </div>
      </div>
      <div class="field">
        <label for="tl-vis">Visibilidade</label>
        <select id="tl-vis">
          <option value="1">Pública (todos podem ver e avaliar)</option>
          <option value="0">Privada (só eu)</option>
        </select>
      </div>
      <h2>Jogos</h2>
      <div id="jogos-lista">
        <div class="jogo-row">
          <input type="text" maxlength="60" placeholder="Nome do jogo" aria-label="Nome do jogo" required>
          <input type="number" min="1980" max="2026" placeholder="Ano" aria-label="Ano de lançamento" required>
          <select aria-label="Tipo"><option>Arcade</option><option>Console</option><option>PC</option><option>Mobile</option></select>
          <button type="button" class="rm" aria-label="Remover jogo">&times;</button>
          <div class="desc-wrap">
            <input type="text" class="jogo-desc" maxlength="50" placeholder="Descrição breve (opcional, até 50 caracteres)" aria-label="Descrição breve do jogo">
            <span class="desc-count mono">0/50</span>
          </div>
        </div>
      </div>
      <button type="button" class="btn-add" id="add-jogo">+ Adicionar jogo</button>
      <div class="criar-actions">
        <a href="/home" class="btn-cancelar">Cancelar</a>
        <button type="submit" class="btn-enter">Publicar linha do tempo</button>
      </div>
    </form>
  </div>
</section>
<script type="module" src="./criar.ts"></script>
</body>
</html>
